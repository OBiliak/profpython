[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
dynamic = ["version"]  # one source of the version: car_catalog.__version__
description = "Car catalog REST API: search, filters and statistics of cars (FastAPI, SQLAlchemy, SQLite)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Олег Біляк" }]
keywords = ["car catalog", "fastapi", "rest api", "sqlalchemy", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "types-PyYAML>=6.0", "ruff>=0.5", "build>=1.2"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.23"]
bench = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/OBiliak/profpython"

[project.scripts]
car-catalog = "car_catalog.main:main"

[tool.setuptools.dynamic]
version = { attr = "car_catalog.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
car_catalog = ["migrations/script.py.mako", "migrations/README"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle, Pyflakes, warnings, import sorting
ignore = ["E501"]  # line length is kept by ruff format; long strings and docstrings stay as they are

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: tests that combine several components (files, services, application flow)",
]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Starlette 1.x recommends httpx2 for TestClient; the course uses httpx (TestClient works the same)
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["car_catalog"]
omit = [
    # scripts that only print demonstrations, menus and experiment results
    "*/car_catalog/analysis.py",
    "*/car_catalog/benchmark.py",
    "*/car_catalog/console.py",
    "*/car_catalog/data.py",
    "*/car_catalog/domain/demo.py",
    "*/car_catalog/domain/experiments.py",
    "*/car_catalog/importer/experiments.py",
    "*/car_catalog/stream/demo.py",
    "*/car_catalog/stream/experiment.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "typecheck_demo"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["car_catalog.domain.*", "car_catalog.importer.*", "car_catalog.domain.demo", "errors"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
